name: Crate Publish
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      bump-type:
        required: false
        type: string
        default: "patch"
      write-android-version-code:
        description: "Update version_code in [package.metadata.android.sdk] in Cargo.toml on bump (no-op if absent)"
        required: false
        type: boolean
        default: true
      publish-crates-io:
        required: false
        type: boolean
        default: true
      generate-release-notes:
        required: false
        type: boolean
        default: true
      create-release:
        required: false
        type: boolean
        default: true
      prerelease:
        required: false
        type: boolean
        default: false
      workspace-publish:
        required: false
        type: boolean
        default: false
      workspace-exclude:
        required: false
        type: string
        default: ""
      system-deps:
        required: false
        type: string
        default: ""
      dispatch-on-release:
        required: false
        type: string
        default: "[]"
        description: "JSON array of workflow file names to dispatch after publish, with version_name input"
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

concurrency:
  group: crate-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version || steps.read.outputs.version }}
      tag: v${{ steps.bump.outputs.version || steps.read.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2

      - id: read
        name: Read current version
        run: |
          VERSION=$(cargo metadata --manifest-path "${{ inputs.working-directory }}/Cargo.toml" --no-deps --format-version=1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Auto bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump-type != 'none'
        id: bump
        run: |
          OLD_VERSION=$(cargo metadata --manifest-path "${{ inputs.working-directory }}/Cargo.toml" --no-deps --format-version=1 | jq -r '.packages[0].version')
          IFS='.' read -ra PARTS <<< "$OLD_VERSION"
          MAJOR="${PARTS[0]}"; MINOR="${PARTS[1]}"; PATCH="${PARTS[2]}"
          case "${{ inputs.bump-type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          sed -i -E "/^\[workspace\.package\]/,/^\[/ s/^version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" "${{ inputs.working-directory }}/Cargo.toml"
          # Fallback: bump any [package] with literal version == OLD (excluding standalone uniffi-bindgen and target)
          find "${{ inputs.working-directory }}" -name Cargo.toml -not -path "*/target/*" -not -path "*/uniffi-bindgen/*" -exec sed -i -E "/^\[package\]/,/^\[/ s/^version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" {} \;
          # Update [workspace.dependencies] version refs for internal path crates only (only in workspace root)
          sed -i -E "/^\[workspace\.dependencies\]/,/^\[/{ /path =/ s/version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$NEW_VERSION\"/g }" "${{ inputs.working-directory }}/Cargo.toml"
          cargo update --manifest-path "${{ inputs.working-directory }}/Cargo.toml" --workspace

          if [[ "${{ inputs.write-android-version-code }}" == "true" ]]; then
            IFS='.' read -r NMAJ NMIN NPAT <<<"$NEW_VERSION"
            VERSION_CODE=$(( (1<<24) | (NMAJ<<16) | (NMIN<<8) | NPAT ))
            # Root manifest plus workspace members (e.g. apps/renamite-editor/Cargo.toml)
            while IFS= read -r MANIFEST; do
              if grep -q '^version_code\s*=' "$MANIFEST"; then
                sed -i -E "0,/^version_code\s*=.*/s//version_code = $VERSION_CODE/" "$MANIFEST"
              else
                awk -v vc="$VERSION_CODE" '
                  BEGIN{printed=0}
                  {print}
                  /^\[package\.metadata\.android\.sdk\]$/ && printed==0 {print "version_code = " vc; printed=1}
                ' "$MANIFEST" > "$MANIFEST.new" && mv "$MANIFEST.new" "$MANIFEST"
              fi
            done < <(grep -rl '^\[package\.metadata\.android\.sdk\]' --include=Cargo.toml "${{ inputs.working-directory }}" | grep -v '/target/')
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: bump to v$NEW_VERSION [skip ci]" || echo "No changes"
          if [[ "${{ inputs.create-release }}" == "true" ]]; then
            git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
            git push && git push --tags
          else
            git push
          fi

      - name: Validate tag matches Cargo.toml version
        run: |
          VERSION=$(cargo metadata --manifest-path "${{ inputs.working-directory }}/Cargo.toml" --no-deps --format-version=1 | jq -r '.packages[0].version')
          TAG="${{ steps.bump.outputs.version || steps.read.outputs.version }}"
          if [ "v$VERSION" != "v$TAG" ]; then
            echo "Version mismatch: tag v$TAG != Cargo.toml v$VERSION"
            exit 1
          fi

      - id: commit
        name: Capture commit SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    if: inputs.publish-crates-io
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      crate_files: ${{ steps.pkg.outputs.crate_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - uses: Swatinem/rust-cache@v2

      - name: Cargo package
        id: pkg
        run: |
          set -euxo pipefail
          PKG_FLAGS="--locked"
          EXCLUDES="${{ inputs.workspace-exclude }}"
          if [ "${{ inputs.workspace-publish }}" == "true" ]; then
            PKG_FLAGS="$PKG_FLAGS --workspace"
            for ex in $EXCLUDES; do
              PKG_FLAGS="$PKG_FLAGS --exclude $ex"
            done
          fi
          cargo package $PKG_FLAGS
          echo "crate_files=$(ls target/package/*.crate | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Upload crate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crate
          path: ${{ inputs.working-directory }}/target/package/*.crate
          if-no-files-found: error
          retention-days: 1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          PKG_FLAGS="--locked"
          EXCLUDES="${{ inputs.workspace-exclude }}"
          if [ "${{ inputs.workspace-publish }}" == "true" ]; then
            PKG_FLAGS="$PKG_FLAGS --workspace"
            for ex in $EXCLUDES; do
              PKG_FLAGS="$PKG_FLAGS --exclude $ex"
            done
          fi
          for i in 1 2 3; do
            if cargo publish $PKG_FLAGS 2>&1 | tee /tmp/publish.log; then exit 0; fi
            if grep -qi "already exists\|already published" /tmp/publish.log; then
              echo "Version ${{ needs.version.outputs.version }} already published on crates.io; skipping."
              exit 0
            fi
            echo "Publish failed, retrying in $((i*10))s..." >&2
            cat /tmp/publish.log >&2 || true
            sleep $((i*10))
          done
          echo "Publish failed after 3 attempts" >&2
          cat /tmp/publish.log >&2 || true
          exit 1

  release:
    if: inputs.create-release
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download crate artifacts
        uses: actions/download-artifact@v7
        with:
          name: crate
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.crate > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.commit_sha }}
          generate_release_notes: ${{ inputs.generate-release-notes }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.crate
            dist/SHA256SUMS.txt

  dispatch-on-release:
    if: ${{ inputs.dispatch-on-release != '[]' && !cancelled() }}
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflows = JSON.parse('${{ inputs.dispatch-on-release }}');
            const version = '${{ needs.version.outputs.version }}';
            const ref = '${{ github.ref_name }}';
            for (const wf of workflows) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: ref,
                inputs: { version_name: version }
              });
              core.info(`Dispatched ${wf} for v${version}`);
            }
