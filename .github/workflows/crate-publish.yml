name: Crate Publish
on:
  workflow_call:
    inputs:
      crate-name:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      auto-bump:
        required: false
        type: boolean
        default: false
      bump-type:
        required: false
        type: string
        default: "patch"
      publish-crates-io:
        required: false
        type: boolean
        default: true
      generate-release-notes:
        required: false
        type: boolean
        default: true
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version || steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        name: Read current version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Auto bump version
        if: inputs.auto-bump
        id: bump
        run: |
          OLD_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          IFS='.' read -ra PARTS <<< "$OLD_VERSION"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"
          case "${{ inputs.bump-type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          find . -name Cargo.toml -exec sed -i "s/^version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" {} \;

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "No changes"
          git tag "v$NEW_VERSION"
          git push && git push --tags

  publish:
    if: inputs.publish-crates-io && inputs.crate-name != ''
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for i in 1 2 3; do
            if cargo publish --locked; then exit 0; fi
            echo "Publish failed, retrying in $((i*10))s..."; sleep $((i*10))
          done
          exit 1

  release:
    if: always()
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: ${{ inputs.generate-release-notes }}