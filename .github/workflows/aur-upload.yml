name: AUR Upload
on:
  workflow_call:
    inputs:
      pkgname:
        required: true
        type: string
        description: "AUR package name (e.g. ftl-csv-convert-bin)"
      pkgdesc:
        required: true
        type: string
        description: "Package description"
      license:
        required: false
        type: string
        default: "MIT OR Apache-2.0"
      depends:
        required: false
        type: string
        default: ""
      provides:
        required: false
        type: string
        default: ""
      conflicts:
        required: false
        type: string
        default: ""
      optdepends:
        required: false
        type: string
        default: ""
        description: "Optional dependencies, e.g. \"'yay: for installing from AUR' 'foo: bar reason'\" (quoted entries, eval'd into the array)"
      options:
        required: false
        type: string
        default: "!strip"
        description: "Space-separated makepkg options (e.g. '!strip !lto')"
      binary-name:
        required: true
        type: string
        description: "Name of the binary in the GitHub release (e.g. ftl-csv-convert-linux-x86_64)"
      app-slug:
        required: false
        type: string
        default: ""
        description: "Installed binary name (defaults to pkgname with -bin suffix stripped)"
      app-name:
        required: false
        type: string
        default: ""
        description: "Display name for the .desktop entry (defaults to app-slug)"
      arch:
        required: false
        type: string
        default: "x86_64"
        description: "Package architecture (single-arch packages only; ignored when binary-name-aarch64 is set)"
      binary-name-aarch64:
        required: false
        type: string
        default: ""
        description: "aarch64 release asset name. If set, builds a dual-arch (x86_64 + aarch64) package where binary-name is the x86_64 asset"
      version:
        required: false
        type: string
        default: ""
        description: "Release version (eg: 1.2.3). If empty, fetches latest from GH Releases"
      working-directory:
        required: false
        type: string
        default: "."
      maintainer-name:
        required: false
        type: string
        default: ""
      maintainer-email:
        required: false
        type: string
        default: ""
      install-desktop:
        required: false
        type: boolean
        default: true
        description: "Install a .desktop launcher entry to /usr/share/applications"
      desktop-comment:
        required: false
        type: string
        default: ""
        description: "Comment field for the .desktop entry (defaults to pkgdesc)"
      desktop-categories:
        required: false
        type: string
        default: "Utility;"
        description: "Semicolon-separated .desktop Categories (e.g. 'Audio;AudioVideo;Player;')"
      desktop-mime-type:
        required: false
        type: string
        default: ""
        description: "Semicolon-separated .desktop MimeType (e.g. 'audio/mpeg;audio/flac;')"
      desktop-args:
        required: false
        type: string
        default: ""
        description: "Extra Exec args for the .desktop entry (e.g. '%F' or '%U')"
      icon-url:
        required: false
        type: string
        default: ""
        description: "URL of the app icon (png or svg) to install to pixmaps + hicolor. Empty disables icon install."
      desktop-file-path:
        required: false
        type: string
        default: ""
        description: "Repo-relative path to a .desktop file (e.g. 'others/flathub/io.github.mlm_games.myapp.desktop') fetched at the release tag. Icon= is rewritten to app-slug. Overrides the desktop-* inputs."
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

jobs:
  update-aur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ -z "${VERSION}" ]]; then
            VERSION=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download binaries and compute hashes
        id: hash
        run: |
          set -euo pipefail
          BIN="${{ inputs.binary-name }}"
          BIN_AARCH64="${{ inputs.binary-name-aarch64 }}"
          VERSION="${{ steps.version.outputs.version }}"
          wget -O "$BIN" "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${BIN}"
          HASH=$(sha256sum "$BIN" | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [[ -n "$BIN_AARCH64" ]]; then
            wget -O "$BIN_AARCH64" "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${BIN_AARCH64}"
            HASH_AARCH64=$(sha256sum "$BIN_AARCH64" | cut -d' ' -f1)
            echo "hash_aarch64=$HASH_AARCH64" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PKGBUILD
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BIN="${{ inputs.binary-name }}"
          BIN_AARCH64="${{ inputs.binary-name-aarch64 }}"
          HASH="${{ steps.hash.outputs.hash }}"
          HASH_AARCH64="${{ steps.hash.outputs.hash_aarch64 }}"
          PKGNAME="${{ inputs.pkgname }}"
          PKGDESC="${{ inputs.pkgdesc }}"
          ARCH="${{ inputs.arch }}"
          LICENSE="${{ inputs.license }}"
          DEPENDS="${{ inputs.depends }}"
          OPTDEPENDS="${{ inputs.optdepends }}"
          OPTIONS="${{ inputs.options }}"
          PROVIDES="${{ inputs.provides }}"
          CONFLICTS="${{ inputs.conflicts }}"
          MNAME="${{ inputs.maintainer-name }}"
          MEMAIL="${{ inputs.maintainer-email }}"
          REPO="${{ github.repository }}"
          SLUG="${{ inputs.app-slug }}"
          if [[ -z "${SLUG}" ]]; then
            SLUG="${PKGNAME}"
            SLUG="${SLUG%-bin}"
          fi
          APP_NAME="${{ inputs.app-name }}"
          if [[ -z "${APP_NAME}" ]]; then
            APP_NAME="${SLUG}"
          fi
          COMMENT="${{ inputs.desktop-comment }}"
          if [[ -z "${COMMENT}" ]]; then
            COMMENT="${PKGDESC}"
          fi
          CATEGORIES="${{ inputs.desktop-categories }}"
          MIMETYPE="${{ inputs.desktop-mime-type }}"
          DESKTOP_ARGS="${{ inputs.desktop-args }}"
          ICON_URL="${{ inputs.icon-url }}"
          DESKTOP_FILE="${{ inputs.desktop-file-path }}"
          INSTALL_DESKTOP="${{ inputs.install-desktop }}"
          ICON_FILE=""
          if [[ -n "${ICON_URL}" && "${INSTALL_DESKTOP}" == "true" ]]; then
            ICON_EXT="${ICON_URL##*.}"
            ICON_EXT="${ICON_EXT%%\?*}"
            ICON_EXT="$(printf '%s' "${ICON_EXT}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${ICON_EXT}" == "svg" ]]; then
              ICON_FILE="icon.svg"
            else
              ICON_FILE="icon.png"
            fi
          fi
          DIR_X64="${BIN%.tar.gz}"
          DIR_X64="${DIR_X64%.tgz}"
          DIR_ARM="${BIN_AARCH64%.tar.gz}"
          DIR_ARM="${DIR_ARM%.tgz}"

          DESKTOP_SNIPPET=""
          if [[ "${INSTALL_DESKTOP}" == "true" && -n "${DESKTOP_FILE}" ]]; then
            for TAG in "v${VERSION}" "${VERSION}"; do
              DESKTOP_URL="https://raw.githubusercontent.com/${REPO}/${TAG}/${DESKTOP_FILE}"
              if curl -fsSL --max-time 30 -o upstream.desktop "${DESKTOP_URL}"; then
                echo "Fetched .desktop from ${DESKTOP_URL}"
                break
              fi
              echo "Not found: ${DESKTOP_URL}"
              rm -f upstream.desktop
            done
            if [[ ! -f upstream.desktop ]]; then
              echo "::error::desktop-file-path '${DESKTOP_FILE}' not found at tag v${VERSION} or ${VERSION}" >&2
              exit 1
            fi
            if ! grep -q '^\[Desktop Entry\]' upstream.desktop; then
              echo "::error::${DESKTOP_FILE} is not a valid .desktop file (missing [Desktop Entry])" >&2
              exit 1
            fi
            sed -i -E "s/^Icon=.*/Icon=${SLUG}/" upstream.desktop
            if command -v desktop-file-validate >/dev/null 2>&1; then
              desktop-file-validate upstream.desktop
            else
              echo "desktop-file-validate not available, skipping validation"
            fi
            DESKTOP_SNIPPET="$(cat upstream.desktop)"
          fi

          {
          echo "# Maintainer: ${MNAME} <${MEMAIL}>"
          echo "pkgname=${PKGNAME}"
          echo "_pkgname=${SLUG}"
          echo "pkgver=${VERSION}"
          echo "_tag=v${VERSION}"
          echo "pkgrel=1"
          echo "pkgdesc='${PKGDESC}'"
          if [[ -n "${BIN_AARCH64}" ]]; then
            echo "arch=('x86_64' 'aarch64')"
          else
            echo "arch=('${ARCH}')"
          fi
          echo "url=\"https://github.com/${REPO}\""
          echo "license=('${LICENSE}')"
          echo "depends=(${DEPENDS})"
          if [[ -n "${OPTDEPENDS}" ]]; then
            echo "optdepends=("
            # shellcheck disable=SC2086
            eval "for _od in ${OPTDEPENDS}; do echo \"  '\$_od'\"; done"
            echo ")"
          fi
          echo "provides=(${PROVIDES})"
          echo "conflicts=(${CONFLICTS})"
          echo "options=(${OPTIONS})"
          if [[ -n "${BIN_AARCH64}" ]]; then
            echo "source_x86_64=(\"${BIN}::https://github.com/${REPO}/releases/download/\${_tag}/${BIN}\")"
            echo "source_aarch64=(\"${BIN_AARCH64}::https://github.com/${REPO}/releases/download/\${_tag}/${BIN_AARCH64}\")"
            echo "sha256sums_x86_64=('${HASH}')"
            echo "sha256sums_aarch64=('${HASH_AARCH64}')"
          else
            echo "source=(\"\${pkgname}-\${pkgver}::https://github.com/${REPO}/releases/download/v\${pkgver}/${BIN}\")"
            echo "sha256sums=('${HASH}')"
          fi
          if [[ -n "${ICON_URL}" ]]; then
            echo "source+=(\"${ICON_FILE}::${ICON_URL}\")"
            echo "sha256sums+=('SKIP')"
          fi
          echo ""
          echo "package() {"
          if [[ -n "${BIN_AARCH64}" ]]; then
            echo "  local dir"
            echo "  if [[ \"\$CARCH\" == \"x86_64\" ]]; then"
            echo "    dir=\"\${srcdir}/${DIR_X64}\""
            echo "  else"
            echo "    dir=\"\${srcdir}/${DIR_ARM}\""
            echo "  fi"
            echo "  install -Dm755 \"\${dir}/${SLUG}\" \"\${pkgdir}/usr/bin/${SLUG}\""
          else
            echo "  install -Dm755 \"\${srcdir}/\${pkgname}-\${pkgver}\" \"\${pkgdir}/usr/bin/${SLUG}\""
          fi
          if [[ "${INSTALL_DESKTOP}" == "true" ]]; then
            if [[ -n "${DESKTOP_SNIPPET}" ]]; then
              echo ""
              echo "  install -Dm644 /dev/stdin \"\${pkgdir}/usr/share/applications/${SLUG}.desktop\" << DESKTOP_EOF"
              printf '%s\n' "${DESKTOP_SNIPPET}"
              echo "DESKTOP_EOF"
            else
              echo ""
              echo "  install -Dm644 /dev/stdin \"\${pkgdir}/usr/share/applications/${SLUG}.desktop\" << DESKTOP_EOF"
              echo "[Desktop Entry]"
              echo "Name=${APP_NAME}"
              echo "Comment=${COMMENT}"
              if [[ -n "${DESKTOP_ARGS}" ]]; then
                echo "Exec=${SLUG} ${DESKTOP_ARGS}"
              else
                echo "Exec=${SLUG}"
              fi
              if [[ -n "${ICON_FILE}" ]]; then
                echo "Icon=${SLUG}"
              fi
              echo "Terminal=false"
              echo "Type=Application"
              echo "Categories=${CATEGORIES}"
              if [[ -n "${MIMETYPE}" ]]; then
                echo "MimeType=${MIMETYPE}"
              fi
              echo "StartupNotify=true"
              echo "StartupWMClass=${SLUG}"
              echo "DESKTOP_EOF"
            fi
            if [[ -n "${ICON_FILE}" ]]; then
              echo ""
              if [[ "${ICON_FILE}" == *.svg ]]; then
                echo "  install -Dm644 \"\${srcdir}/${ICON_FILE}\" \"\${pkgdir}/usr/share/pixmaps/${SLUG}.svg\""
                echo "  install -Dm644 \"\${srcdir}/${ICON_FILE}\" \"\${pkgdir}/usr/share/icons/hicolor/scalable/apps/${SLUG}.svg\""
              else
                echo "  install -Dm644 \"\${srcdir}/${ICON_FILE}\" \"\${pkgdir}/usr/share/pixmaps/${SLUG}.png\""
                echo "  install -Dm644 \"\${srcdir}/${ICON_FILE}\" \"\${pkgdir}/usr/share/icons/hicolor/256x256/apps/${SLUG}.png\""
              fi
            fi
          fi
          echo "}"
          } > PKGBUILD

          echo "Generated PKGBUILD:"
          cat PKGBUILD

      - name: Publish to AUR
        uses: mlm-games/aur-deploy-action@master
        with:
          pkgbuild: ./PKGBUILD
          auto_pkgrel: true
          commit_username: ${{ inputs.maintainer-name || 'github-actions[bot]' }}
          commit_email: ${{ inputs.maintainer-email || 'github-actions[bot]@users.noreply.github.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.version }}"
