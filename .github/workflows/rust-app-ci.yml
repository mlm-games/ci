name: Rust Desktop CI
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      system-deps-linux:
        required: false
        type: string
        default: "libasound2-dev libudev-dev pkg-config libx11-dev libxcb1-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev libfontconfig-dev libwayland-dev libxkbcommon-dev"
      features:
        required: false
        type: string
        default: ""
      run-clippy:
        required: false
        type: boolean
        default: false
      run-fmt:
        required: false
        type: boolean
        default: true
      run-test:
        required: false
        type: boolean
        default: true
      extra-checks:
        description: >
          Newline-separated list of extra `cargo check` arguments.
          Example:
          ```
          --target wasm32-unknown-unknown --no-default-features
          --target aarch64-linux-android
          --features physics
          ```
        required: false
        type: string
        default: ""
      include-android:
        required: false
        type: boolean
        default: false
      android-api:
        required: false
        type: string
        default: "36"
      android-build-tools:
        required: false
        type: string
        default: "36.0.0"
      android-ndk-version:
        required: false
        type: string
        default: "28.2.13676358"
      java-version:
        required: false
        type: string
        default: "21"
      java-distribution:
        required: false
        type: string
        default: "temurin"
      android-check-rapk:
        required: false
        type: boolean
        default: true
      upload-artifacts:
        required: false
        type: boolean
        default: false
      app-slug:
        required: false
        type: string
        default: ""
      cargo-rapk-version:
        required: false
        type: string
        default: "0.18.3"
jobs:
  desktop:
    name: ${{ inputs.run-test && 'Build & test' || 'Build' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-26.04-arm
          - os: macos-latest
          - os: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ inputs.system-deps-linux }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config

      - name: Configure pkg-config (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf

      - name: Configure pkg-config and PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$msys2\mingw64\bin\pkgconf.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$msys2\mingw64\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_PATH -Value "$msys2\mingw64\bin"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      - name: Extra checks
        if: inputs.extra-checks != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "::group::cargo check $line"
            cargo check $line
            echo "::endgroup::"
          done <<< "${{ inputs.extra-checks }}"

      - name: Test
        if: inputs.run-test
        run: cargo test --workspace ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      - name: Fmt check
        if: inputs.run-fmt
        run: cargo fmt --all -- --check

      # - name: Clippy
      #   if: inputs.run-clippy
      #   run: cargo clippy --workspace --all-targets ${{ inputs.features && format('--features {0}', inputs.features) || '' }} -- --deny warnings

      - name: Upload debug binary
        if: inputs.upload-artifacts && inputs.app-slug != ''
        shell: bash
        run: |
          set -euxo pipefail
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          BIN="${{ inputs.app-slug }}"
          mkdir -p artifacts
          if [ -f "target/debug/${BIN}" ]; then
            cp "target/debug/${BIN}" "artifacts/${BIN}-${TARGET}"
          elif [ -f "target/debug/${BIN}.exe" ]; then
            cp "target/debug/${BIN}.exe" "artifacts/${BIN}-${TARGET}.exe"
          fi
          for f in README* LICENSE* CHANGELOG*; do [ -e "$f" ] && cp "$f" artifacts/ || true; done

      - name: Upload CI artifact
        if: inputs.upload-artifacts && inputs.app-slug != ''
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ inputs.working-directory }}/artifacts/

  android-check:
    if: inputs.include-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-${{ inputs.android-api }}" \
            "build-tools;${{ inputs.android-build-tools }}" \
            "ndk;${{ inputs.android-ndk-version }}"

      - name: Install cargo-rapk
        if: inputs.android-check-rapk
        run: cargo install cargo-rapk@${{ inputs.cargo-rapk-version }} --locked

      - name: Check Android target
        if: inputs.android-check-rapk
        run: cargo rapk check

      - name: Set D8 jar path
        if: inputs.android-check-rapk
        shell: bash
        run: |
          echo "ANDROID_D8_JAR=$ANDROID_HOME/build-tools/${{ inputs.android-build-tools }}/lib/d8.jar" >> "$GITHUB_ENV"

      - name: Build unsigned debug APK
        if: inputs.android-check-rapk
        shell: bash
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/${{ inputs.android-ndk-version }}"
          cargo rapk build --target aarch64-linux-android --lib --unsigned

      - name: Prepare APK artifact
        if: inputs.upload-artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          APK_DIR="target/aarch64-linux-android/debug/apk"
          if [ ! -d "$APK_DIR" ]; then
            APK_DIR="target/debug/apk"
          fi
          APK_SRC=$(ls -1t "$APK_DIR"/*.apk 2>/dev/null | head -n1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" artifacts/app-debug.apk
          fi

      - name: Upload APK artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: ${{ inputs.working-directory }}/artifacts/*.apk
