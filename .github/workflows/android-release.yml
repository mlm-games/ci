name: Android Release
on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      app-slug:
        required: true
        type: string
      application-id:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "21"
      java-distribution:
        required: false
        type: string
        default: "corretto"
      build-gradle-path:
        required: false
        type: string
        default: "app/build.gradle.kts"
      gradle-module:
        required: false
        type: string
        default: "app"
      flavors:
        required: false
        type: string
        default: ""
        description: 'JSON array of product flavors to build separately, e.g. ["GenericGeckoIncluded","FossGeckoIncluded"]. Empty builds all variants via bundleRelease/assembleRelease and collects all.'
      play-track:
        required: false
        type: string
        default: ""
      play-flavor:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      generate-release-notes:
        required: false
        type: boolean
        default: true
      bump-type:
        required: false
        type: string
        default: "patch"
    secrets:
      KEYSTORE:
        required: true
      KEYSTORE_PASSPHRASE:
        required: true
      STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.out.outputs.version_name }}
      version_code: ${{ steps.out.outputs.version_code }}
      commit_sha: ${{ steps.out.outputs.commit_sha }}
      release_notes: ${{ steps.notes.outputs.release-notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # REQUIRED for notes + tags

      - id: version
        name: Read current version
        run: |
          VERSION_CODE=$(grep "versionCode" ${{ inputs.build-gradle-path }} | head -1 | grep -oE '[0-9]+')
          VERSION_NAME=$(grep "versionName" ${{ inputs.build-gradle-path }} | head -1 | grep -oE '"([^"]+)"' | tr -d '"')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Compute new version
        id: bumpcalc
        run: |
          OLD_VERSION_CODE=${{ steps.version.outputs.version_code }}
          OLD_VERSION_NAME=${{ steps.version.outputs.version_name }}
          case "${{ inputs.bump-type }}" in
            major|minor|patch)
              NEW_VERSION_CODE=$((OLD_VERSION_CODE + 10))
              IFS='.' read -ra VERSION_PARTS <<< "$OLD_VERSION_NAME"
              MAJOR="${VERSION_PARTS[0]}"; MINOR="${VERSION_PARTS[1]}"; PATCH="${VERSION_PARTS[2]}"
              case "${{ inputs.bump-type }}" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              NEW_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
              echo "do_bump=true" >> $GITHUB_OUTPUT
              ;;
            *)
              NEW_VERSION_CODE=$OLD_VERSION_CODE
              NEW_VERSION_NAME=$OLD_VERSION_NAME
              echo "do_bump=false" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT

      # Notes BEFORE bump commit, full history available
      - name: Generate Release Notes
        if: inputs.generate-release-notes
        id: notes
        uses: mlm-games/release-notes-generator@main
        with:
          version: ${{ steps.bumpcalc.outputs.version_name }}
          changelog-path: 'CHANGELOG.md'
          version-file-path: './fastlane/metadata/android/en-US/changelogs/${{ steps.bumpcalc.outputs.version_code }}.txt'
          version-code: '${{ steps.bumpcalc.outputs.version_code }}'
          format: '- {{subject}}'
          exclude-patterns: 'chore:,ci:,docs:,build:,style:,test:,Bump version,bump version,Update release notes,Merge pull request,[skip ci],dependabot'
          auto-commit: 'false'
          debug: 'true'

      - name: Commit version bump + release notes
        id: commit
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          if [ "${{ steps.bumpcalc.outputs.do_bump }}" = "true" ]; then
            sed -i -E "s/versionCode\s*[= ]\s*${{ steps.version.outputs.version_code }}/versionCode = ${{ steps.bumpcalc.outputs.version_code }}/" ${{ inputs.build-gradle-path }}
            sed -i -E "s/versionName\s*[= ]\s*\"${{ steps.version.outputs.version_name }}\"/versionName = \"${{ steps.bumpcalc.outputs.version_name }}\"/" ${{ inputs.build-gradle-path }}
          fi

          git add ${{ inputs.build-gradle-path }} 2>/dev/null || true
          git add CHANGELOG.md 2>/dev/null || true
          git add fastlane/metadata/android/en-US/changelogs/ 2>/dev/null || true

          git commit -m "chore: bump version to ${{ steps.bumpcalc.outputs.version_name }} [skip ci]" || echo "No changes"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set outputs
        id: out
        run: |
          echo "version_name=${{ steps.bumpcalc.outputs.version_name }}" >> $GITHUB_OUTPUT
          echo "version_code=${{ steps.bumpcalc.outputs.version_code }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ steps.commit.outputs.commit_sha || github.sha }}" >> $GITHUB_OUTPUT

  build:
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(inputs.flavors != '' && inputs.flavors || '[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" > release.keystore.asc
          gpg -d --passphrase "${{ secrets.KEYSTORE_PASSPHRASE }}" --batch release.keystore.asc > release.keystore

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.flavor }}" = "" ]; then
            ./gradlew :${{ inputs.gradle-module }}:bundleRelease -PenableApkSplits=false
          else
            ./gradlew :${{ inputs.gradle-module }}:bundle${{ matrix.flavor }}Release -PenableApkSplits=false
          fi

      - name: Prepare AAB artifacts
        id: aab
        run: |
          mkdir -p artifacts
          # Find all AABs produced (covers single-variant and multi-variant builds)
          AAB_FILES=$(find ${{ inputs.gradle-module }}/build/outputs/bundle -name "*.aab" || true)
          if [ -z "$AAB_FILES" ]; then
            echo "::error::No AAB found under ${{ inputs.gradle-module }}/build/outputs/bundle"
            find ${{ inputs.gradle-module }}/build/outputs -type f || true
            exit 1
          fi
          echo "$AAB_FILES"
          if [ "${{ matrix.flavor }}" != "" ]; then
            # Matrix mode: one flavor per job, name with flavor
            AAB_PATH=$(echo "$AAB_FILES" | head -n1)
            cp "$AAB_PATH" "artifacts/${{ inputs.app-slug }}-${{ needs.prepare-version.outputs.version_name }}-${{ matrix.flavor }}.aab"
            echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"
            echo "Prepared AAB: artifacts/${{ inputs.app-slug }}-${{ needs.prepare-version.outputs.version_name }}-${{ matrix.flavor }}.aab from $AAB_PATH"
          else
            # Default mode: may contain multiple flavors (bundleRelease builds all variants)
            # Collect each AAB with flavor suffix derived from parent dir to avoid overwriting
            # Use a file to pass first path as output
            FIRST=""
            echo "$AAB_FILES" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              dir=$(basename "$(dirname "$f")")
              if [ "$dir" = "release" ]; then
                dest="artifacts/${{ inputs.app-slug }}-${{ needs.prepare-version.outputs.version_name }}.aab"
              else
                flavor=$(echo "$dir" | sed -E 's/Release$//')
                dest="artifacts/${{ inputs.app-slug }}-${{ needs.prepare-version.outputs.version_name }}-${flavor}.aab"
              fi
              echo "Copy $f -> $dest"
              cp "$f" "$dest"
              if [ -z "$FIRST" ]; then
                FIRST="$f"
              fi
            done
            # head -n1 for Play upload fallback
            AAB_PATH=$(echo "$AAB_FILES" | head -n1)
            echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"
            ls -lh artifacts/
          fi

      - name: Upload AAB to Google Play
        if: inputs.play-track != '' && inputs.play-track != 'none' && (inputs.play-flavor == '' || inputs.play-flavor == matrix.flavor)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.application-id }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.play-track }}
          status: completed
          whatsNewDirectory: fastlane/metadata/android

      - name: Clean before APK build
        run: ./gradlew clean

      - name: Build APK splits
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.flavor }}" = "" ]; then
            ./gradlew :${{ inputs.gradle-module }}:assembleRelease -PenableApkSplits=true -PincludeUniversalApk=true
          else
            ./gradlew :${{ inputs.gradle-module }}:assemble${{ matrix.flavor }}Release -PenableApkSplits=true -PincludeUniversalApk=true
          fi

      - name: Prepare APK artifacts
        run: |
          mkdir -p artifacts
          # Find all APKs (exclude intermediate app-*.apk without arch naming, but keep apkDist renamed ones)
          find ${{ inputs.gradle-module }}/build/outputs/apk -name "*.apk" | while IFS= read -r apk; do
            # only keep files that contain an arch token (apkDist produces arch in name)
            arch=$(echo "$apk" | grep -oE '(arm64-v8a|armeabi-v7a|x86_64|x86|universal)' || true)
            if [ -z "$arch" ]; then
              continue
            fi
            # detect flavor hint from path/filename to avoid overwriting same arch across flavors
            flavor_hint=$(echo "$apk" | grep -oiE 'GenericGeckoIncluded|GenericGeckoExcluded|FossGeckoIncluded|FossGeckoExcluded|genericGeckoIncluded|genericGeckoExcluded|fossGeckoIncluded|fossGeckoExcluded' | head -n1 || true)
            if [ "${{ matrix.flavor }}" != "" ]; then
              dest="artifacts/${{ inputs.app-slug }}-${{ matrix.flavor }}-${{ needs.prepare-version.outputs.version_name }}-${arch}.apk"
              # matrix job isolates flavor, no overwrite risk, but handle universal vs arch duplicates
              # ensure unique per arch
              if [ -f "$dest" ]; then
                echo "Skipping duplicate $dest for $apk"
                continue
              fi
              cp "$apk" "$dest"
              echo "Collected $apk -> $dest"
            else
              if [ -n "$flavor_hint" ]; then
                dest="artifacts/${{ inputs.app-slug }}-${flavor_hint}-${{ needs.prepare-version.outputs.version_name }}-${arch}.apk"
              else
                dest="artifacts/${{ inputs.app-slug }}-${{ needs.prepare-version.outputs.version_name }}-${arch}.apk"
              fi
              if [ -f "$dest" ]; then
                echo "Skipping duplicate $dest for $apk"
                continue
              fi
              cp "$apk" "$dest"
              echo "Collected $apk -> $dest"
            fi
          done
          echo "Artifacts collected:"
          ls -lh artifacts/ || true

      - name: Upload artifacts (per flavor)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.prepare-version.outputs.version_name }}-${{ matrix.flavor || 'default' }}
          path: artifacts/*
          if-no-files-found: warn

  release:
    needs: [prepare-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts from matrix
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p out
          find artifacts -type f -maxdepth 5 -print -exec cp {} out/ \;
          echo "Flattened release assets:"
          ls -lh out/

      - name: Ensure changelog file for release body
        id: bodyfile
        run: |
          NOTES_FILE="fastlane/metadata/android/en-US/changelogs/${{ needs.prepare-version.outputs.version_code }}.txt"
          mkdir -p "$(dirname "$NOTES_FILE")"
          if [ ! -s "$NOTES_FILE" ]; then
            if [ -n "${{ needs.prepare-version.outputs.release_notes }}" ]; then
              printf '%s\n' "${{ needs.prepare-version.outputs.release_notes }}" > "$NOTES_FILE"
            else
              echo "- No user-facing changes since previous release" > "$NOTES_FILE"
            fi
          fi
          echo "path=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: ${{ inputs.app-name }} ${{ needs.prepare-version.outputs.version_name }}
          tag_name: ${{ needs.prepare-version.outputs.version_name }}
          target_commitish: ${{ needs.prepare-version.outputs.commit_sha }}
          prerelease: ${{ inputs.prerelease }}
          body_path: ${{ steps.bodyfile.outputs.path }}
          generate_release_notes: true
